<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BlackjackTRNR - Performance</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="performanceBody">

<div class="performancePage">

    <header class="performanceHeader">

        <a href="index.html" class="backButton">

            ← Back to Trainer

        </a>

        <h1>

            📊 Performance

        </h1>

        <p>

            Track your progress and review every decision.

        </p>

    </header>

    <!-- ======================================== -->
    <!-- SUMMARY CARDS -->
    <!-- ======================================== -->

    <section class="summaryGrid">

        <div class="summaryCard">

            <span class="cardTitle">

                Accuracy

            </span>

            <span
                id="accuracy"
                class="cardValue">

                0%

            </span>

        </div>

        <div class="summaryCard">

            <span class="cardTitle">

                Hands Played

            </span>

            <span
                id="handsPlayed"
                class="cardValue">

                0

            </span>

        </div>

        <div class="summaryCard">

            <span class="cardTitle">

                Correct

            </span>

            <span
                id="correct"
                class="cardValue">

                0

            </span>

        </div>

        <div class="summaryCard">

            <span class="cardTitle">

                Incorrect

            </span>

            <span
                id="incorrect"
                class="cardValue">

                0

            </span>

        </div>

        <div class="summaryCard">

            <span class="cardTitle">

                Current Streak

            </span>

            <span
                id="currentStreak"
                class="cardValue">

                0

            </span>

        </div>

        <div class="summaryCard">

            <span class="cardTitle">

                Best Streak

            </span>

            <span
                id="bestStreak"
                class="cardValue">

                0

            </span>

        </div>

    </section>

    <!-- ======================================== -->
    <!-- PERFORMANCE -->
    <!-- ======================================== -->

<section class="performanceSection">

    <details>

        <summary>

            📈 Performance by Hand Type

        </summary>

        <div class="summaryGrid handTypeGrid">

        <div class="summaryCard">

            <span class="cardTitle">

                Hard Hands

            </span>

            <span
                id="hardAccuracy"
                class="cardValue">

                0%

            </span>

        </div>

        <div class="summaryCard">

            <span class="cardTitle">

                Soft Hands

            </span>

            <span
                id="softAccuracy"
                class="cardValue">

                0%

            </span>

        </div>

        <div class="summaryCard">

            <span class="cardTitle">

                Pairs

            </span>

            <span
                id="pairAccuracy"
                class="cardValue">

                0%

            </span>

        </div>


    </div>

    </details>

</section>

<section class="performanceSection">

    <details>

        <summary>

            📉 Most Missed Hands

        </summary>

        <div id="mostMissedHands">

        <!-- Generated by JavaScript -->

    </div>

    </details>

</section>

    <!-- ======================================== -->
    <!-- HISTORY -->
    <!-- ======================================== -->

<section class="historySection">

    <details>

        <summary>

            📜 Recent Hands

        </summary>

        <div id="history">

            <!-- Generated by JavaScript -->

        </div>

    </details>

    </section>

    <!-- ======================================== -->
    <!-- FOOTER -->
    <!-- ======================================== -->

    <footer class="performanceFooter">

        <button id="resetStats">

            🔄 Reset Statistics

        </button>

    </footer>

</div>

<script src="js/stats.js"></script>
<script src="js/statsPage.js"></script>

</body>

</html>
