<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ======================================== -->
    <!-- META -->
    <!-- ======================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>

        BlackjackTRNR

    </title>

    <!-- ======================================== -->
    <!-- STYLES -->
    <!-- ======================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="css/style.css?v=7">

</head>

<body class="trainerPage">

<!-- ======================================== -->
<!-- HEADER -->
<!-- ======================================== -->

<header id="topBar">

    <div class="logo">

        ♠ ♥ BlackjackTRNR ♦ ♣

    </div>

    <div class="subtitle">

        Basic Strategy Trainer

    </div>

</header>

<!-- ======================================== -->
<!-- APP -->
<!-- ======================================== -->

<div id="app">

    <!-- ======================================== -->
    <!-- SIDEBAR -->
    <!-- ======================================== -->

    <aside id="sidebar">

        <!-- ========================= -->
        <!-- ACTION BUTTONS -->
        <!-- ========================= -->

        <div class="buttonGroup">

            <button
                id="hit"
                class="btn btn-success btn-lg">

                Hit

            </button>

            <button
                id="stand"
                class="btn btn-success btn-lg">

                Stand

            </button>

            <button
                id="double"
                class="btn btn-success btn-lg">

                Double

            </button>

            <button
                id="split"
                class="btn btn-success btn-lg">

                Split

            </button>

            <button
                id="surrender"
                class="btn btn-success btn-lg">

                Surrender

            </button>

        </div>

        <!-- ========================= -->
        <!-- QUICK STATS -->
        <!-- ========================= -->

        <div
            class="stats"
            id="quickStats">

            <h4>

                Statistics

            </h4>

            <div class="quickStatsRow">

                <div>

                    <small>

                        Accuracy

                    </small>

                    <h3 id="accuracy">

                        0.0%

                    </h3>

                </div>

                <div>

                    <small>

                        Hands

                    </small>

                    <h3 id="handsPlayed">

                        0

                    </h3>

                </div>

                <div>

                    <small>

                        Streak

                    </small>

                    <h3 id="streak">

                        0

                    </h3>

                </div>

            </div>

        </div>

        <!-- ========================= -->
        <!-- TRAINING MODE -->
        <!-- ========================= -->

        <section class="trainerModeSection">

    <div class="trainerModeTitle">

        Adaptive Mode

    </div>

    <label class="trainerSwitch">

        <input
            type="checkbox"
            id="adaptiveToggle">

        <span class="trainerSlider">

            <span class="trainerLabelOff">

                ON

            </span>

            <span class="trainerLabelOn">

                OFF

            </span>

        </span>

    </label>

</section>

        <!-- ========================= -->
        <!-- NEXT HAND -->
        <!-- ========================= -->

        <button
            id="nextHand"
            class="btn btn-warning btn-lg">

            🃏 New Hand

        </button>

    </aside>

    <!-- ======================================== -->
    <!-- TABLE -->
    <!-- ======================================== -->

    <main id="tableArea">

        <div class="table">

            <!-- ========================= -->
            <!-- DEALER -->
            <!-- ========================= -->

            <div class="section">

                <h3>

                    Dealer

                </h3>

                <div
                    id="dealerCards"
                    class="cardRow">

                </div>

            </div>

            <!-- ========================= -->
            <!-- PLAYER -->
            <!-- ========================= -->

            <div class="section">

                <h3>

                    Your Hand

                </h3>

                <div
                    id="playerCards"
                    class="cardRow">

                </div>

            </div>

            <!-- ========================= -->
            <!-- FEEDBACK -->
            <!-- ========================= -->

            <div id="feedback">

                Choose the correct play.

            </div>

        </div>

    </main>

</div>

<!-- ======================================== -->
<!-- SCRIPTS -->
<!-- ======================================== -->

<script src="js/hands.js"></script>
<script src="js/strategy.js"></script>
<script src="js/stats.js"></script>
<script src="js/scenarios.js"></script>
<script src="js/adaptiveTrainer.js"></script>
<script src="js/script.js"></script>

</body>

</html>
