<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BlackjackTRNR</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

<body class="trainerPage">

<body>

<header id="topBar">

    <div class="logo">
        ♠ ♥ BlackjackTRNR ♦ ♣
    </div>

    <div class="subtitle">
        Basic Strategy Trainer
    </div>

</header>

<div id="app">

    <aside id="sidebar">

        <div class="buttonGroup">

            <button id="hit" class="btn btn-success btn-lg">
                Hit
            </button>

            <button id="stand" class="btn btn-success btn-lg">
                Stand
            </button>

            <button id="double" class="btn btn-success btn-lg">
                Double
            </button>

            <button id="split" class="btn btn-success btn-lg">
                Split
            </button>

            <button id="surrender" class="btn btn-success btn-lg">
                Surrender
            </button>

        </div>

        <div class="stats" id="quickStats">

    <h4>📊 Statistics</h4>

    <p id="accuracy">Accuracy: --%</p>

    <p id="handsPlayed">Hands Played: 0</p>

    <p id="streak">Current Streak: 0</p>

    <small class="statsHint">

        Double-click for detailed statistics

    </small>

</div>

        <button
    id="nextHand"
    class="btn btn-warning btn-lg">

    New Hand

</button>

    </aside>

    <main id="tableArea">

        <div class="table">

            <div class="section">

                <h3>Dealer</h3>

                <div id="dealerCards" class="cardRow"></div>

            </div>

            <div class="section">

                <h3>Your Hand</h3>

                <div id="playerCards" class="cardRow"></div>

            </div>

            <div id="feedback">

                Choose the correct play.

            </div>

        </div>

    </main>

</div>

<script src="js/hands.js"></script>
<script src="js/strategy.js"></script>
<script src="js/stats.js"></script>
<script src="js/script.js"></script>

</body>

</html>
